<?xml version="1.0" encoding="UTF-8"?>
<!--
  SkimDown small-icon variant. Used to rasterize the 16/24/32px slots of the
  Windows ICO so the brand stays recognizable even when the full icon's
  details (line variations, folded corner, chevron) would smear.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="SkimDown small">
  <defs>
    <linearGradient id="skim-small-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5AA0FF"/>
      <stop offset="100%" stop-color="#1F5BCC"/>
    </linearGradient>
  </defs>

  <!-- Stronger corner radius proportion so the tile reads as a brand mark
       even at 16px. -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#skim-small-bg)"/>

  <!-- Simplified document: just three bold horizontal bars (heading + 2 body).
       Bars are wider/thicker than the full icon so they survive downscaling. -->
  <rect x="60" y="76"  width="136" height="22" rx="6" fill="#FFFFFF"/>
  <rect x="60" y="118" width="136" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="60" y="160" width="100" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.65"/>
</svg>
