<?xml version="1.0" encoding="UTF-8"?>
<!--
  SkimDown app icon.

  Visual concept:
    A quiet reading surface — a stylized document with markdown-style lines
    (one heading, two body, one shorter bullet) — sitting on a soft rounded
    square. A subtle downward chevron in the corner hints at "skim DOWN".

  Theme-aware: uses currentColor for the document foreground so the icon
  picks up the surrounding ImageIcon foreground brush. Background tile uses
  a fixed gradient so it stays branded regardless of theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="SkimDown">
  <defs>
    <!-- Brand-blue gradient for the rounded tile. -->
    <linearGradient id="skim-tile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5AA0FF"/>
      <stop offset="55%"  stop-color="#3D7BE8"/>
      <stop offset="100%" stop-color="#1F5BCC"/>
    </linearGradient>

    <!-- Subtle inner shadow for the document so it feels lifted off the tile. -->
    <filter id="skim-doc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded brand tile. -->
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#skim-tile-bg)"/>
  <!-- Soft top highlight. -->
  <rect x="8" y="8" width="240" height="120" rx="52" ry="52" fill="white" fill-opacity="0.08"/>

  <!-- Document page (white, slightly translucent to feel papery on the tile). -->
  <g filter="url(#skim-doc-shadow)">
    <rect x="60" y="48" width="136" height="170" rx="14" ry="14"
          fill="#FFFFFF" fill-opacity="0.96"/>
    <!-- Folded corner (top-right) to suggest a real page. -->
    <path d="M 174 48 L 196 70 L 174 70 Z" fill="#E8EEF8"/>
    <path d="M 174 48 L 196 70 L 174 70 Z" fill="none" stroke="#C8D6F0" stroke-width="1.5"/>
  </g>

  <!-- Markdown-like content lines. Colors hint at heading/body/list. -->
  <!-- Heading (thicker, brand color). -->
  <rect x="76" y="78"  width="80" height="10" rx="3" fill="#1F5BCC"/>
  <!-- Body lines. -->
  <rect x="76" y="102" width="104" height="6" rx="2" fill="#5B6B82" fill-opacity="0.75"/>
  <rect x="76" y="118" width="92"  height="6" rx="2" fill="#5B6B82" fill-opacity="0.75"/>
  <rect x="76" y="134" width="80"  height="6" rx="2" fill="#5B6B82" fill-opacity="0.45"/>
  <!-- Bullet item: dot + line. -->
  <circle cx="80" cy="160" r="3" fill="#1F5BCC"/>
  <rect   x="92" y="157" width="64" height="6" rx="2" fill="#5B6B82" fill-opacity="0.75"/>
  <!-- Second body line. -->
  <rect x="76" y="180" width="100" height="6" rx="2" fill="#5B6B82" fill-opacity="0.55"/>
  <rect x="76" y="196" width="68"  height="6" rx="2" fill="#5B6B82" fill-opacity="0.35"/>

  <!-- Skim-down chevron accent in the lower-right of the tile. -->
  <g transform="translate(196 192)" opacity="0.95">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" fill-opacity="0.18"/>
    <path d="M -10 -4 L 0 6 L 10 -4"
          fill="none" stroke="#FFFFFF" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
